# Runs the report once a day on GitHub's free runners and commits the result to data/.
# Live demo of this repo's own watchlist.txt; fork it and edit watchlist.txt to watch your coins.
# More than 3 tokens: add a repository secret CWX_KEY (prepaid key, see README).
name: daily report
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-report
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run
        env:
          CWX_KEY: ${{ secrets.CWX_KEY }}
        run: |
          mkdir -p data
          rc=0
          python3 daily_token_report.py watchlist.txt --history data/history.csv --report data/report.md || rc=$?
          # 2 = some tokens NOT CHECKED: still commit, the report says so
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]
      - name: commit
        run: |
          git config user.name "daily-token-report"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "report $(date -u +%F)" && git push; }
